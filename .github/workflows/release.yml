name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Zip razor files
        run: zip "muls_dexxer_bot_${VERSION}.zip" *.razor

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "muls_dexxer_bot_${VERSION}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
