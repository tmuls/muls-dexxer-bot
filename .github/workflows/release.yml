name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Zip razor files
        run: |
          mkdir -p "staging/Combat/Dexxer"
          cp *.razor "staging/Combat/Dexxer/"
          (cd staging && zip -r "../muls_dexxer_bot_${VERSION}.zip" "Combat")

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "muls_dexxer_bot_${VERSION}.zip" "install.sh"
